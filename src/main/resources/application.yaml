server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: food-court-microservice-foodcourt

  datasource:
    url: jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
    username: postgres.fgemaxsxbefxrctlmpjj
    password: ${DB_FOODCOURT_FOODCOURT_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET_KEY}
  validity: 3600000

user-service:
  url: http://localhost:8090/api/v1